# Temporary: the 2026-10-22 one-shot security upgrade pulled in releases that
# are still inside pnpm's default 24h release-age window. Remove this list
# after 2026-10-22T18:15Z UTC; the default gate then covers them again.
minimumReleaseAgeExclude:
  - "@astrojs/check"
  - "@astrojs/language-server"
  - "@astrojs/markdown-remark"
  - "@astrojs/markdown-satteri"
  - "@astrojs/mdx"
  - "@astrojs/prism"
  - "@astrojs/react"
  - "@astrojs/telemetry"
  - "astro"
  - "lucide-react"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^1.3.0
  vite-plus: ^1.3.0
overrides:
  vite@*: "catalog:"
  # Transitive via ajv; pnpm update won't re-resolve it. ^3.1.8 covers
  # 5 high fast-uri CVEs (fixed in 3.1.5/3.1.6).
  fast-uri: ^3.1.8
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  sharp: true
