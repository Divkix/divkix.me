onlyBuiltDependencies:
  - esbuild
  - sharp
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
overrides:
  # astro check relies on TypeScript's programmatic API, which TS 7.0 does not
  # ship yet. Pin to latest 6.x until astro check supports TS 7.
  typescript: ^6.0.3
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@astrojs/telemetry@3.3.3"
  - astro@7.0.7
