onlyBuiltDependencies:
  - esbuild
  - sharp
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vite-plus: 0.3.3
overrides:
  # astro check relies on TypeScript's programmatic API, which TS 7.0 does not
  # ship yet. Pin to latest 6.x until astro check supports TS 7.
  typescript: ^6.0.3
  vite@*: "catalog:"
  # Transitive via ajv; pnpm update won't re-resolve it. ^3.1.7 covers
  # 5 high fast-uri CVEs (fixed in 3.1.5/3.1.6).
  fast-uri: ^3.1.7
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@astrojs/telemetry@3.3.3"
  - astro@7.0.7
