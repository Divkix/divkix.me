# Exact versions admitted by the 2026-10-22 one-shot security upgrade while
# younger than pnpm's default 24h window. Version-pinned so future releases of
# these packages stay gated; safe to delete once these versions age in.
minimumReleaseAgeExclude:
  - "@astrojs/check@0.9.12"
  - "@astrojs/language-server@2.17.3"
  - "@astrojs/markdown-remark@7.3.4"
  - "@astrojs/markdown-satteri@0.4.5"
  - "@astrojs/mdx@8.1.1"
  - "@astrojs/prism@4.1.1"
  - "@astrojs/react@7.1.1"
  - "@astrojs/telemetry@3.4.1"
  - "astro@7.4.2"
  - "lucide-react@1.61.0"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
  # Transitive via ajv; pnpm update won't re-resolve it. ^3.1.8 covers
  # 5 high fast-uri CVEs (fixed in 3.1.5/3.1.6).
  fast-uri: ^3.1.8
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  sharp: true
