name: Setup dependencies
description: Install Node and pnpm, then restore exact installed dependencies.
runs:
  using: composite
  steps:
    # Read the pnpm pin from package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      id: node
      with:
        node-version: 26.12.1
        package-manager-cache: false

    - name: Cache node_modules
      uses: actions/cache@v6
      id: dependencies
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', '.npmrc') }}

    - name: Install dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
