name: Dependabot automerge

# Metadata-only `pull_request_target`: this job never checks out, installs or
# runs pull-request code; it reads PR/check metadata and merges through the API
# with the repository token. The repository Actions policy scopes
# `pull_request_target` to the dependabot[bot] actor and to exactly this file
# (https://github.com/Divkix/divkix.me/settings/actions/rules/7004), so an
# owner-pushed `synchronize` on a Dependabot branch stays blocked.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  # Needed so the rollup cannot hide a commit status (not just check runs)
  # from the gate; everything observed must be settled successful.
  statuses: read

# One gate per pull request; a newer event cancels a stale run.
concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Merge gate
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate and merge minor/patch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          REVIEWER: Divkix
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?}" "${REPO:?}" "${PR:?}" "${HEAD_SHA:?}" "${AUTHOR:?}"
          : "${HEAD_REPO:?}" "${BASE_REF:?}" "${DRAFT:?}" "${REVIEWER:?}"
          UPDATE_TYPE="${UPDATE_TYPE:-}"

          # Our own run's check is excluded from the rollup so the gate cannot
          # deadlock on itself.
          OWN_CHECK="Merge gate"
          TIMEOUT="${GATE_TIMEOUT_SECONDS:-2700}"
          POLL="${GATE_POLL_SECONDS:-15}"
          DRY_RUN="${DRY_RUN:-0}"
          REQUIRED_CHECKS=(
            "Verify, build, audit"
            "GitGuardian Security Checks"
            "Workers Builds: divkix-me"
          )

          log() { printf '%s %s\n' "$(date -u +%H:%M:%S)" "$*"; }
          die() { log "FAIL: $*"; exit 1; }

          # Fail-closed preconditions, mirroring the job-level `if:`.
          [ "$AUTHOR" = "dependabot[bot]" ] || die "author '$AUTHOR' is not dependabot[bot]"
          [ "$HEAD_REPO" = "$REPO" ] || die "head repo '$HEAD_REPO' is not in-repo"
          [ "$BASE_REF" = "main" ] || die "base branch '$BASE_REF' is not main"
          [ "$DRAFT" = "false" ] || die "PR is a draft"

          case "$UPDATE_TYPE" in
          version-update:semver-major)
            log "major update: requesting review from $REVIEWER, never auto-merging"
            [ "$DRY_RUN" = "1" ] || gh pr edit "$PR" --repo "$REPO" --add-reviewer "$REVIEWER"
            exit 0
            ;;
          version-update:semver-minor|version-update:semver-patch)
            log "update-type '$UPDATE_TYPE': eligible for the merge gate"
            ;;
          *)
            die "update-type '$UPDATE_TYPE' is not an exact semver-minor/semver-patch"
            ;;
          esac

          while :; do
            # A run only speaks for the commit it was started on.
            current_sha="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
            [ "$current_sha" = "$HEAD_SHA" ] ||
              die "head moved from $HEAD_SHA to $current_sha; a newer run gates it"

            # Full rollup, not `gh pr checks --watch`: checks that register
            # later are seen because the required names must be present too.
            rollup="$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup \
              --jq '.statusCheckRollup[] | [(.name // .context), (.conclusion // .state // "PENDING")] | @tsv')"
            [ -n "$rollup" ] || log "no checks or statuses registered yet"

            declare -A seen=() pending_check=() bad=()
            while IFS=$'\t' read -r name state; do
              [ -n "${name:-}" ] || continue
              [ "$name" = "$OWN_CHECK" ] && continue
              seen["$name"]=1
              case "$state" in
              SUCCESS|NEUTRAL|SKIPPED) ;;
              FAILURE|ERROR|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE|STALE)
                bad["$name"]="$state"
                ;;
              *) pending_check["$name"]="$state" ;;
              esac
            done <<< "$rollup"

            if [ "${#bad[@]}" -gt 0 ]; then
              for name in "${!bad[@]}"; do log "not successful: $name -> ${bad[$name]}"; done
              die "at least one check or status is not successful"
            fi

            missing=()
            for name in "${REQUIRED_CHECKS[@]}"; do
              [ -n "${seen[$name]:-}" ] || missing+=("$name")
            done

            if [ "${#missing[@]}" -eq 0 ] && [ "${#pending_check[@]}" -eq 0 ]; then
              break
            fi

            if [ "$SECONDS" -ge "$TIMEOUT" ]; then
              if [ "${#missing[@]}" -gt 0 ]; then
                for name in "${missing[@]}"; do log "missing required check: $name"; done
              fi
              for name in "${!pending_check[@]}"; do
                log "still pending: $name -> ${pending_check[$name]}"
              done
              die "gate timed out after ${TIMEOUT}s; nothing was merged"
            fi

            log "waiting: ${#missing[@]} required check(s) not registered, ${#pending_check[@]} pending; retry in ${POLL}s"
            sleep "$POLL"
          done

          final_sha="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          [ "$final_sha" = "$HEAD_SHA" ] ||
            die "head moved between gate and merge ($HEAD_SHA to $final_sha)"

          log "all required checks successful on $HEAD_SHA"
          if [ "$DRY_RUN" = "1" ]; then
            log "DRY RUN: would run: gh pr merge $PR --repo $REPO --squash --match-head-commit $HEAD_SHA"
            exit 0
          fi
          # Squash-merge the exact commit that passed the gate. Branch deletion
          # comes from the repository's delete_branch_on_merge setting, which
          # also cleans up manually merged major updates; `--delete-branch`
          # would fail once that setting has already removed the ref.
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
          log "merged $HEAD_SHA"
