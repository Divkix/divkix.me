name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type-check, lint, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` input: pnpm/action-setup reads packageManager from
      # package.json, so the pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          CF_PAGES_BRANCH: ""

      - name: SEO audit
        run: pnpm run audit:seo
