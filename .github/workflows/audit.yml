name: Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` input: pnpm/action-setup reads packageManager from
      # package.json, so the pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1

      # No install: audit reads pnpm-lock.yaml.
      - name: pnpm audit
        run: pnpm audit --audit-level high
