version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # vite-plus toolchain moves in lockstep via `vp migrate` only — solo bumps desync it and break the build.
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      - dependency-name: "@voidzero-dev/vite-plus-core"
      - dependency-name: "@voidzero-dev/vite-plus-test"
      # astro check exits with an error on TypeScript 7.0; it needs the TS 6 API.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "ci"
      - "dependencies"
